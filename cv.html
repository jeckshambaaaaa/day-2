<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Full Layar</title>
    <style>
        /* Menghilangkan margin dan padding default browser */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Mengatur tabel agar memenuhi seluruh lebar dan tinggi layar */
        table.full-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse; /* Menghilangkan jarak antar sel */
        }

        /* Styling tambahan untuk border sel */
        table.full-table, table.full-table th, table.full-table td {
            border: 1px solid black;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <table class="full-table">
        <thead>
            <tr>
                <th>Header 1</th>
                <th>Header 2</th>
                <th>Header 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Data 1</td>
                <td>Data 2</td>
                <td>Data 3</td>
            </tr>
            <tr>
                <td>Data 4</td>
                <td>Data 5</td>
                <td>Data 6</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
